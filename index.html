<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#150a1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Para ti</title>

<meta property="og:title" content="Tengo algo que decirte">
<meta property="og:description" content="Ábrelo cuando estés tranquila.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Dancing+Script:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PALETA · noche malva + papel rosa
   ============================================================ */
:root{
  --noche:#150a1c;
  --tinta-clara:#f7eef3;
  --tinta-clara-suave:rgba(247,238,243,.68);
  --rosa-luz:#f9a8c9;
  --rosa-luz-suave:rgba(249,168,201,.35);

  --papel:#fdf3f7;
  --papel-borde:#f6e2ea;
  --texto:#3b2b33;
  --texto-suave:#7c5f6b;
  --acento:#c2447a;
  --acento-claro:#e88aa8;
  --renglon:rgba(194,68,122,.12);

  --sobre:#f7dfe8;
  --sobre-osc:#eec6d6;

  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --mano:'Dancing Script', 'Segoe Script', cursive;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* El scroll lo lleva el <html>, nunca el <body>: si el body fuera el que
   scrollea, window.scrollY se quedaría en 0 y se romperían el parallax
   y el indicador de "desliza". */
html{
  height:100%;
  overflow-x:hidden;
  overflow-x:clip;        /* "clip" no crea barra lateral; el de arriba es el respaldo */
  overflow-y:hidden;
  overscroll-behavior-x:none;
}
html.leyendo{
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

html,body{
  background:var(--noche);
  color:var(--tinta-clara);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

body{
  min-height:100%;
  overflow-x:hidden;
  overflow-x:clip;
  /* el dedo solo mueve la carta hacia arriba y abajo, nunca de lado */
  touch-action:pan-y;
  overscroll-behavior-x:none;
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}

#cielo{position:fixed;inset:0;z-index:0;display:block;}

.halo{
  position:fixed;left:50%;top:42%;
  width:min(140vw,900px);height:min(140vw,900px);
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(249,168,201,.16) 0%, rgba(230,120,170,.06) 38%, transparent 68%);
  z-index:1;pointer-events:none;
  animation:respirar 9s ease-in-out infinite;
}
@keyframes respirar{
  0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.09);}
}

.velo{
  position:fixed;inset:0;z-index:2;
  background:rgba(12,5,17,.55);
  opacity:0;pointer-events:none;
  transition:opacity 1.2s ease;
}
.velo.ver{opacity:1;}

@keyframes aparecer{to{opacity:1;}}

/* ============================================================
   FIGURITAS QUE FLOTAN
   ============================================================ */
.decor{
  position:fixed;inset:0;z-index:3;
  pointer-events:none;overflow:hidden;
}
.decor .fig{
  position:absolute;
  opacity:0;
  will-change:transform;
  transition:opacity 1.4s ease;
}
.decor.ver .fig{opacity:.92;}

.fig .baila{
  display:block;
  animation:flotar var(--dur,6s) ease-in-out infinite;
  animation-delay:var(--del,0s);
}
.fig svg{
  display:block;width:100%;height:auto;
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.4));
}

@keyframes flotar{
  0%,100%{transform:translateY(0) rotate(var(--rot,0deg)) scale(1);}
  33%{transform:translateY(-13px) rotate(calc(var(--rot,0deg) + 7deg)) scale(1.03);}
  66%{transform:translateY(5px) rotate(calc(var(--rot,0deg) - 5deg)) scale(.98);}
}

/* figuritas pegadas al borde de la hoja */
.borde{
  position:absolute;
  z-index:6;
  pointer-events:none;
}
.borde .baila{animation:flotar var(--dur,7s) ease-in-out infinite;animation-delay:var(--del,0s);display:block;}
.borde svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 9px rgba(120,30,70,.28));}

/* figuritas dentro del texto */
.deco-linea{
  display:block;width:34px;margin:0 auto 10px;
  animation:mecer 4.5s ease-in-out infinite;
}
@keyframes mecer{
  0%,100%{transform:rotate(-7deg);}
  50%{transform:rotate(7deg);}
}

/* ============================================================
   PORTADA · EL SOBRE
   ============================================================ */
#escena{
  position:fixed;inset:0;z-index:8;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:clamp(26px,6.5vh,52px);
  padding:calc(var(--safe-t) + 24px) 22px calc(var(--safe-b) + 24px);
  transition:opacity .85s ease, transform 1s cubic-bezier(.4,0,.2,1);
}
#escena.fuera{opacity:0;transform:scale(1.28);pointer-events:none;}

.intro{text-align:center;opacity:0;animation:aparecer 1.6s ease .3s forwards;}
.intro .para{
  font-size:.66rem;letter-spacing:.36em;text-transform:uppercase;
  color:var(--rosa-luz);margin-bottom:14px;
}
.intro .nombre{
  font-family:var(--serif);
  font-size:clamp(2.3rem,10.5vw,3.2rem);
  font-weight:300;line-height:1.05;
}

.sobre-zona{position:relative;perspective:1400px;opacity:0;animation:aparecer 1.6s ease .9s forwards;}

.sobre{
  position:relative;
  width:min(80vw,330px);
  height:calc(min(80vw,330px) * .66);
  transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(0 26px 45px rgba(0,0,0,.55));
}
.sobre:active{transform:scale(.975);}
.sobre.abierto,.sobre.abierto:active{transform:translateY(5%);}

.sobre-fondo{
  position:absolute;inset:0;
  background:linear-gradient(160deg,var(--sobre) 0%, var(--sobre-osc) 100%);
  border-radius:5px;z-index:1;
}

.hoja-mini{
  position:absolute;left:6%;bottom:5%;
  width:88%;height:86%;
  background:linear-gradient(175deg,#fffafc 0%, #f7e4ec 100%);
  border-radius:3px;z-index:2;
  transform:translateY(0);
  transition:transform 1.05s cubic-bezier(.34,1.15,.64,1) .5s;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
  overflow:hidden;
}
.hoja-mini::before{
  content:'';position:absolute;inset:14% 13%;
  background:repeating-linear-gradient(to bottom,
    rgba(194,68,122,.22) 0 1px, transparent 1px 10px);
  opacity:.55;
}
.sobre.abierto .hoja-mini{transform:translateY(-64%) scale(1.02);}

.sobre-frente{
  position:absolute;inset:0;
  background:linear-gradient(155deg,#fae7ee 0%, #edc4d5 100%);
  clip-path:polygon(0 0, 50% 46%, 100% 0, 100% 100%, 0 100%);
  border-radius:5px;z-index:3;
}
.sobre-frente::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg, rgba(255,255,255,.4) 0%, transparent 45%);
  opacity:.7;
}

.solapa{
  position:absolute;top:0;left:0;
  width:100%;height:46%;
  background:linear-gradient(180deg,#fbeaf1 0%, #eec9d8 100%);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  transform-origin:top center;
  transform:rotateX(0deg);
  transition:transform .85s cubic-bezier(.6,0,.3,1), z-index 0s .42s;
  z-index:5;border-radius:5px 5px 0 0;
  backface-visibility:hidden;
}
.sobre.abierto .solapa{transform:rotateX(-178deg);z-index:0;}

/* al guardar la carta, la solapa y la hoja se mueven sin esperar */
.sobre.cerrando .hoja-mini,
.sobre.cerrando .solapa{transition-delay:0s;}

.sello{
  position:absolute;left:50%;top:46%;
  width:31%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  z-index:6;
  /* la sombra sigue la silueta de la flor, no un cuadro ni un círculo */
  filter:drop-shadow(0 5px 11px rgba(0,0,0,.45));
  transition:opacity .35s ease .1s, transform .5s ease;
}
.sello svg{display:block;width:100%;height:100%;}
.sobre.abierto .sello{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(30deg);}

/* figuritas que acompañan al sobre en la portada */
.guardia{
  position:absolute;
  width:clamp(46px,13vw,62px);
  z-index:7;
}
.guardia .baila{animation:flotar var(--dur,5.5s) ease-in-out infinite;animation-delay:var(--del,0s);display:block;}
.guardia svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));}
.guardia.izq{left:-14%;bottom:-12%;}
.guardia.der{right:-14%;top:-18%;}

.pista{text-align:center;opacity:0;animation:aparecer 1.4s ease 2s forwards;}
.pista .toca{
  font-size:.82rem;letter-spacing:.3em;text-transform:uppercase;
  color:#fff;
  text-shadow:0 0 18px rgba(249,168,201,.55);
  display:inline-flex;align-items:center;gap:12px;
  animation:latir 3.4s ease-in-out infinite;
}
.pista .toca::before,.pista .toca::after{
  content:'';width:24px;height:1px;background:var(--rosa-luz-suave);
}
@keyframes latir{0%,100%{opacity:.78;}50%{opacity:1;}}

.pista .volumen{
  margin-top:14px;
  font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--tinta-clara-suave);
}
.pulso{
  margin:14px auto 0;width:7px;height:7px;border-radius:50%;
  background:var(--rosa-luz);
  animation:pulso 2.4s ease-out infinite;
}
@keyframes pulso{
  0%{box-shadow:0 0 0 0 rgba(249,168,201,.45);}
  70%{box-shadow:0 0 0 22px rgba(249,168,201,0);}
  100%{box-shadow:0 0 0 0 rgba(249,168,201,0);}
}
#escena.abriendo .pista{opacity:0;transition:opacity .35s ease;animation:none;}

/* ============================================================
   LA HOJA
   ============================================================ */
#hoja{
  position:relative;z-index:5;
  display:none;
  width:min(88vw,40rem);
  margin:calc(var(--safe-t) + 30px) auto calc(var(--safe-b) + 48px);
  padding:clamp(34px,8vw,64px) clamp(24px,7vw,58px) clamp(52px,11vw,80px);

  background:
    linear-gradient(to bottom, transparent 32.8%, rgba(194,68,122,.07) 33%, transparent 33.2%),
    linear-gradient(to bottom, transparent 66.3%, rgba(194,68,122,.055) 66.5%, transparent 66.7%),
    linear-gradient(168deg, #fffbfd 0%, var(--papel) 42%, #f8e6ee 100%);

  color:var(--texto);
  border-radius:3px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.8) inset,
    0 34px 70px rgba(0,0,0,.5),
    0 6px 18px rgba(120,20,60,.25);

  opacity:0;
  transform:translateY(46px) scale(.78);
  transform-origin:center top;
  transition:opacity 1s ease, transform 1.25s cubic-bezier(.18,.78,.25,1);
}
#hoja.abierta{display:block;}
#hoja.ver{opacity:1;transform:none;}

/* al cerrar, la hoja se encoge hacia abajo, como si volviera al sobre */
#hoja.guardando{
  opacity:0;
  transform:translateY(70px) scale(.7);
  transition:opacity .75s ease, transform .95s cubic-bezier(.5,0,.75,0);
}
/* El filo del papel va por DEBAJO de los stickers (z-index -2), para que
   la línea no les pase por encima y parezcan pegados de verdad. */
#hoja::before{
  content:'';position:absolute;inset:0;
  border:1px solid var(--papel-borde);
  border-radius:3px;pointer-events:none;
  z-index:-2;
}

.mono{display:block;width:clamp(56px,15vw,76px);margin:0 auto 18px;}

.encabezado{text-align:center;margin-bottom:clamp(32px,7vw,48px);}
.encabezado .fecha{
  font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--acento);margin-bottom:14px;
}
.encabezado h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(2.1rem,10vw,3rem);
  line-height:1.06;color:var(--texto);
}
.encabezado .linea{
  width:42px;height:1px;background:var(--acento);
  margin:22px auto 0;opacity:.5;
}

p.parrafo{
  font-family:var(--serif);
  font-size:clamp(1.16rem,4.6vw,1.32rem);
  font-weight:400;line-height:1.82;
  color:var(--texto);margin-bottom:1.35em;
}
p.parrafo:first-of-type::first-letter{
  font-size:2.9em;float:left;line-height:.82;
  padding:.06em .09em 0 0;color:var(--acento);font-weight:500;
}
p.parrafo em{font-style:italic;color:#241a1e;}
p.parrafo strong{font-weight:600;color:var(--acento);}

.separador{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin:clamp(32px,7vw,46px) 0;
  color:var(--acento-claro);
}
.separador::before,.separador::after{
  content:'';height:1px;flex:1;max-width:70px;
  background:currentColor;opacity:.6;
}
.separador .fig-sep{width:38px;}

.cita{text-align:center;margin:clamp(28px,6vw,42px) 0;padding:0 6px;}
.cita p{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:clamp(1.26rem,5.2vw,1.55rem);
  line-height:1.58;color:#241a1e;
}
.cita p::before{content:'“';color:var(--acento);}
.cita p::after{content:'”';color:var(--acento);}

.titulo-seccion{
  font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--acento);text-align:center;
  margin:clamp(38px,8vw,56px) 0 20px;
}

.lista{list-style:none;}
.lista li{
  font-family:var(--serif);
  font-size:clamp(1.08rem,4.3vw,1.2rem);
  font-weight:400;line-height:1.6;
  padding:13px 0 13px 28px;
  position:relative;
  border-bottom:1px solid var(--renglon);
}
.lista li::before{
  content:'♡';position:absolute;left:2px;top:12px;
  color:var(--acento-claro);font-size:.95rem;
}
.lista li:last-child{border-bottom:none;}

.tarjetas{display:flex;flex-direction:column;gap:12px;}
.tarjeta{
  position:relative;
  border:1px solid var(--renglon);
  border-radius:16px;
  padding:16px 18px;
  background:linear-gradient(160deg, rgba(255,255,255,.65), rgba(249,214,228,.3));
}
.tarjeta .icono{
  position:absolute;top:-14px;right:12px;width:34px;
  animation:mecer 5s ease-in-out infinite;
}
.tarjeta .quien{
  font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px;padding-right:34px;
}
.tarjeta p{
  font-family:var(--serif);
  font-size:clamp(1.04rem,4.2vw,1.16rem);
  line-height:1.62;color:var(--texto);
}

/* --- la hora mágica --- */
.magica{
  position:relative;
  overflow:hidden;
  margin:clamp(38px,8vw,58px) 0;
  padding:clamp(30px,7vw,46px) clamp(20px,5vw,32px);
  text-align:center;
  border-radius:22px;
  background:linear-gradient(165deg, rgba(255,255,255,.72), rgba(249,214,228,.4));
  border:1px solid var(--renglon);
}
.magica::before{
  content:'';
  position:absolute;
  left:50%;top:30%;
  width:min(70%,260px);aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(226,97,143,.2), transparent 66%);
  animation:resplandor 4.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes resplandor{
  0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
}

.magica .hora{
  position:relative;
  font-family:var(--serif);
  font-size:clamp(2.9rem,15vw,4.4rem);
  font-weight:400;
  line-height:1;
  letter-spacing:.05em;
  color:var(--acento);
  display:inline-flex;
  align-items:center;
  gap:clamp(10px,3vw,18px);
  animation:titilar 3.6s ease-in-out infinite;
}
.magica .hora .chispa{
  font-size:.3em;
  color:var(--acento-claro);
  animation:chispear 2.8s ease-in-out infinite;
}
.magica .hora .chispa:last-child{animation-delay:1.4s;}
@keyframes titilar{
  0%,100%{opacity:.92;text-shadow:0 0 18px rgba(226,97,143,.25);}
  50%{opacity:1;text-shadow:0 0 30px rgba(226,97,143,.5);}
}
@keyframes chispear{
  0%,100%{opacity:.4;transform:scale(.85) rotate(0deg);}
  50%{opacity:1;transform:scale(1.15) rotate(90deg);}
}

.magica .cumple{
  position:relative;
  margin-top:14px;
  font-size:.6rem;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--texto-suave);
}

.magica p{
  position:relative;
  font-family:var(--serif);
  font-size:clamp(1.14rem,4.5vw,1.28rem);
  line-height:1.78;
  color:var(--texto);
  margin-top:1.15em;
}
.magica p strong{font-weight:600;color:var(--acento);}
.magica p em{font-style:italic;color:#241a1e;}

.tiempo{
  margin:clamp(34px,7vw,50px) 0;
  padding:clamp(22px,5vw,32px) 0;
  border-top:1px solid var(--renglon);
  border-bottom:1px solid var(--renglon);
}
.hito{display:flex;align-items:center;gap:16px;padding:15px 4px;}
.hito + .hito{border-top:1px dashed var(--renglon);}
.hito .num{
  font-family:var(--serif);
  font-size:clamp(2.3rem,10vw,3rem);
  font-weight:400;line-height:1;color:var(--acento);
  min-width:3.4em;text-align:right;
  font-variant-numeric:tabular-nums;
}
.hito .detalle .que{
  font-family:var(--serif);
  font-size:clamp(1.04rem,4.2vw,1.18rem);
  line-height:1.4;color:var(--texto);
}
.hito .detalle .cuando{
  font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--texto-suave);margin-top:6px;
}
.tiempo .pie{
  text-align:center;
  font-family:var(--serif);font-style:italic;
  font-size:1.02rem;color:var(--acento);margin-top:18px;
}

.firma{margin-top:clamp(38px,8vw,56px);text-align:right;}
.firma .txt{
  font-family:var(--serif);font-style:italic;
  font-size:1.16rem;color:var(--texto-suave);margin-bottom:2px;
}
.firma .yo{
  font-family:var(--mano);
  font-size:clamp(2.2rem,10vw,2.9rem);
  font-weight:600;color:#a82a5c;line-height:1.2;
}
.firma .raya{
  width:110px;height:1px;background:rgba(168,42,92,.35);
  margin:6px 0 0 auto;
}

.acciones{
  margin-top:clamp(42px,9vw,62px);
  display:flex;flex-direction:column;gap:12px;align-items:center;
}
.btn{
  width:100%;max-width:18rem;
  padding:15px 24px;
  border:1px solid rgba(194,68,122,.45);
  border-radius:100px;
  font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--acento);text-align:center;text-decoration:none;
  transition:background .3s ease, transform .15s ease;
  display:block;
}
.btn:active{transform:scale(.97);background:rgba(194,68,122,.1);}
.btn.principal{background:rgba(194,68,122,.12);border-color:rgba(194,68,122,.7);}
.btn.tenue{border-color:rgba(59,43,51,.16);color:var(--texto-suave);}

.respuesta{
  margin-top:28px;text-align:center;
  font-family:var(--serif);font-style:italic;
  font-size:1.18rem;line-height:1.62;color:#241a1e;
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height 1.2s ease, opacity 1.2s ease;
}
.respuesta.ver{max-height:640px;opacity:1;}

/* el mensaje grande del final */
.rs-grande{
  display:block;
  font-family:var(--mano);
  font-style:normal;
  font-size:clamp(2.3rem,11vw,3.2rem);
  font-weight:600;
  line-height:1.15;
  color:var(--acento);
  text-shadow:0 2px 14px rgba(226,97,143,.3);
  margin-bottom:14px;
  opacity:0;
}
.respuesta.ver .rs-grande{animation:surgir .9s cubic-bezier(.2,.8,.3,1) .2s forwards;}

.rs-media{
  display:block;
  font-family:var(--serif);
  font-style:italic;
  font-size:clamp(1.04rem,4.2vw,1.2rem);
  color:var(--texto-suave);
  margin-bottom:8px;
  opacity:0;
}
.respuesta.ver .rs-media{animation:surgir .9s ease .7s forwards;}

.rs-nombre{
  display:block;
  font-family:var(--serif);
  font-style:normal;
  font-size:clamp(1.24rem,5.2vw,1.55rem);
  font-weight:600;
  line-height:1.35;
  color:var(--texto);
  opacity:0;
}
.respuesta.ver .rs-nombre{animation:surgir 1s ease 1.1s forwards;}

.rs-cierre{
  display:block;
  margin-top:16px;
  font-family:var(--serif);
  font-style:italic;
  font-size:1.02rem;
  color:var(--acento);
  opacity:0;
}
.respuesta.ver .rs-cierre{animation:surgir 1s ease 1.7s forwards;}

@keyframes surgir{
  0%{opacity:0;transform:translateY(16px) scale(.94);}
  100%{opacity:1;transform:none;}
}

/* lienzo de los fuegos artificiales */
#fuegos{
  position:fixed;inset:0;
  z-index:40;
  pointer-events:none;
  display:none;
}
#fuegos.ver{display:block;}

/* ============================================================
   CONTROLES
   ============================================================ */
.controles{
  position:fixed;top:calc(var(--safe-t) + 12px);right:14px;
  z-index:20;display:none;gap:8px;
}
.controles.ver{display:flex;}
.ctrl{
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(247,238,243,.18);
  background:rgba(21,10,28,.62);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  font-size:.92rem;color:var(--tinta-clara-suave);
  transition:color .3s ease, border-color .3s ease, transform .15s ease;
}
.ctrl:active{transform:scale(.9);}
.ctrl.on{color:var(--rosa-luz);border-color:var(--rosa-luz-suave);}

.baja{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 16px);
  transform:translateX(-50%);
  z-index:15;text-align:center;
  font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--tinta-clara-suave);
  opacity:0;transition:opacity .8s ease;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,.6);
}
.baja.ver{opacity:.8;}
.baja .flecha{
  display:block;margin:8px auto 0;width:1px;height:22px;
  background:linear-gradient(var(--rosa-luz), transparent);
  animation:bajar 2.2s ease-in-out infinite;
}
@keyframes bajar{
  0%,100%{transform:translateY(0);opacity:.3;}
  50%{transform:translateY(7px);opacity:1;}
}

.corazon{
  position:fixed;bottom:-40px;z-index:30;
  font-size:18px;pointer-events:none;
  animation:subir linear forwards;
}
@keyframes subir{
  0%{transform:translateY(0) scale(.6);opacity:0;}
  12%{opacity:.9;}
  100%{transform:translateY(-108vh) scale(1.05);opacity:0;}
}

/* ============================================================
   STICKERS · cada personaje, recortado de su viñeta
   El recorte se hace aquí, con la imagen dentro de una ventana
   redonda: no hace falta editar ninguna foto.
   ============================================================ */
.sticker{
  position:relative;
  display:block;
  will-change:transform;
}
.sticker img{
  display:block;
  width:100%;
  height:auto;
  filter:drop-shadow(0 9px 18px rgba(120,30,70,.3));
  opacity:0;
  transition:opacity .6s ease;
}
.sticker img.puesta{opacity:1;}

/* los que van entre el texto */
.sticker.centro{
  margin:clamp(26px,6vw,40px) auto;
}
.sticker.centro.lado-izq{margin-left:clamp(6px,4vw,34px);margin-right:auto;}
.sticker.centro.lado-der{margin-right:clamp(6px,4vw,34px);margin-left:auto;}

/* Los que se asoman por el borde de la hoja.
   z-index negativo: quedan por encima del papel pero POR DEBAJO del texto,
   así nunca tapan una línea aunque se metan un poco. */
.sticker.pegado{
  position:absolute;
  z-index:-1;
}

/* --- los movimientos, según lo que esté haciendo cada uno --- */

/* ballet: la pirueta */
.st-ballet{animation:st-ballet 7s ease-in-out infinite;}
@keyframes st-ballet{
  0%,100%{transform:rotate(var(--base,0deg)) translateY(0) scale(1);}
  25%{transform:rotate(calc(var(--base,0deg) + 8deg)) translateY(-11px) scale(1.03);}
  50%{transform:rotate(var(--base,0deg)) translateY(-15px) scale(1.05);}
  75%{transform:rotate(calc(var(--base,0deg) - 8deg)) translateY(-11px) scale(1.03);}
}

/* tomar: echa la cabeza atrás y sorbe */
.st-beber{animation:st-beber 4.5s ease-in-out infinite;}
@keyframes st-beber{
  0%,52%,100%{transform:rotate(var(--base,0deg)) translateY(0);}
  68%{transform:rotate(calc(var(--base,0deg) - 10deg)) translateY(-5px);}
  84%{transform:rotate(calc(var(--base,0deg) - 5deg)) translateY(-2px);}
}

/* comer: el mordisco */
.st-comer{animation:st-comer 3.4s ease-in-out infinite;}
@keyframes st-comer{
  0%,42%,100%{transform:rotate(var(--base,0deg)) scale(1);}
  54%{transform:rotate(var(--base,0deg)) scale(1.08);}
  64%{transform:rotate(var(--base,0deg)) scale(.97);}
  76%{transform:rotate(var(--base,0deg)) scale(1.05);}
}

/* cargar: le pesa la bolsa y se balancea */
.st-cargar{animation:st-cargar 5s ease-in-out infinite;}
@keyframes st-cargar{
  0%,100%{transform:rotate(calc(var(--base,0deg) - 5deg)) translateY(0);}
  50%{transform:rotate(calc(var(--base,0deg) + 5deg)) translateY(-6px);}
}

/* echado: solo respira */
.st-dormir{animation:st-dormir 6.5s ease-in-out infinite;}
@keyframes st-dormir{
  0%,100%{transform:rotate(var(--base,0deg)) scale(1);}
  50%{transform:rotate(var(--base,0deg)) scale(1.05);}
}

/* saltar: como la rana que es */
.st-saltar{animation:st-saltar 4s ease-in-out infinite;}
@keyframes st-saltar{
  0%,50%,100%{transform:rotate(var(--base,0deg)) translateY(0) scale(1,1);}
  58%{transform:rotate(var(--base,0deg)) translateY(0) scale(1.09,.89);}
  70%{transform:rotate(var(--base,0deg)) translateY(-28px) scale(.92,1.1);}
  86%{transform:rotate(var(--base,0deg)) translateY(0) scale(1.07,.93);}
}

/* deslizarse: pasa de un lado a otro */
.st-desliza{animation:st-desliza 8s ease-in-out infinite;}
@keyframes st-desliza{
  0%{transform:rotate(calc(var(--base,0deg) - 3deg)) translateX(-28px);}
  50%{transform:rotate(calc(var(--base,0deg) + 3deg)) translateX(28px);}
  100%{transform:rotate(calc(var(--base,0deg) - 3deg)) translateX(-28px);}
}

/* flotar: el que va en la nube */
.st-flotar{animation:st-flotar 9s ease-in-out infinite;}
@keyframes st-flotar{
  0%,100%{transform:rotate(var(--base,0deg)) translate(0,0);}
  33%{transform:rotate(calc(var(--base,0deg) - 4deg)) translate(-10px,-14px);}
  66%{transform:rotate(calc(var(--base,0deg) + 4deg)) translate(10px,-7px);}
}

/* brincar: el juguetón */
.st-brinco{animation:st-brinco 3.6s ease-in-out infinite;}
@keyframes st-brinco{
  0%,60%,100%{transform:rotate(var(--base,0deg)) translateY(0) scaleY(1);}
  15%{transform:rotate(var(--base,0deg)) translateY(-16px) scaleY(1.04);}
  30%{transform:rotate(var(--base,0deg)) translateY(0) scaleY(.96);}
  45%{transform:rotate(var(--base,0deg)) translateY(-8px) scaleY(1.02);}
}

/* brillar: la de los diamantes */
.st-brilla{animation:st-brilla 5.5s ease-in-out infinite;}
@keyframes st-brilla{
  0%,100%{transform:rotate(var(--base,0deg)) scale(1);filter:brightness(1);}
  50%{transform:rotate(var(--base,0deg)) scale(1.05);filter:brightness(1.14) saturate(1.1);}
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.25s !important;}
  #hoja{opacity:1;transform:none;}
}
</style>
</head>

  const BLANCO = '#fffafc', ROSA = '#f6b6d0', LILA = '#d9b8f0', CREMA = '#fde9c8';

  function dibujo(nombre, color){
    const f = FIGURAS[nombre];
    return f ? f(color || ROSA) : '';
  }

  // Si pusiste imágenes en CARTA.imagenes, se usan esas.
  const usarImgs = Array.isArray(CARTA.imagenes) && CARTA.imagenes.length > 0;

      const src = CARTA.imagenes[idxImg % CARTA.imagenes.length];

      return '<img src="' + src + '" alt="" style="width:100%;height:auto;display:block;' +

  /* --- los stickers ---
     Vienen ya recortados y con su borde blanco, así que se ponen
     enteros: solo hay que darles tamaño, sitio y movimiento. */
  function montarStickers(){
    const lista = Array.isArray(CARTA.stickers) ? CARTA.stickers : [];
    const hoja = $('#hoja');

    lista.forEach(s => {
      if (!s.img) return;

      const caja = document.createElement('span');
      caja.className = 'sticker ' + (s.mov || 'st-dormir');
      caja.style.setProperty('--base', (s.giro || 0) + 'deg');
      caja.style.width = (s.tam || 130) + 'px';
      if (s.quien) caja.setAttribute('aria-label', s.quien);

      const img = document.createElement('img');
      img.alt = '';
      img.decoding = 'async';
      img.loading  = 'lazy';
      img.addEventListener('load', () => img.classList.add('puesta'));

      // Se prueban varias rutas: da igual si los stickers están dentro de
      // la carpeta "img" o sueltos junto al index.html. Si no aparece por
      // ningún lado, el sticker se quita solo en vez de dejar la imagen rota.
      const soloNombre = s.img.split('/').pop();
      const rutas = [s.img];
      if (s.img.indexOf('/') > -1) rutas.push(soloNombre);
      else rutas.push('img/' + soloNombre);

      let intento = 0;
      img.addEventListener('error', () => {
        intento++;
        if (intento < rutas.length) img.src = encodeURI(rutas[intento]);
        else caja.remove();
      });

      img.src = encodeURI(rutas[0]);
      if (img.complete && img.naturalWidth) img.classList.add('puesta');

      caja.appendChild(img);

      if (s.en === 'izq' || s.en === 'der'){
        caja.classList.add('pegado');
        caja.style.top = s.y || '20%';
        // se sale casi todo del papel: lo poco que entra cae en el margen,
        // donde no hay texto que estorbar
        const fuera = 'calc(-' + (s.tam || 88) + 'px * 0.72)';
        if (s.en === 'izq') caja.style.left  = fuera;
        else                caja.style.right = fuera;
        hoja.appendChild(caja);
      } else {

        caja.classList.add('centro');
        if (s.lado === 'izq') caja.classList.add('lado-izq');
        if (s.lado === 'der') caja.classList.add('lado-der');
        punto.appendChild(caja);
      }
    });
  }

  /* --- movimiento en profundidad al deslizar --- */
  let parallaxListo = false;

  function montarParallax(){
    if (menosMovimiento || parallaxListo) return;   // que no se duplique al reabrir

    const figs = Array.prototype.slice.call(document.querySelectorAll('.decor .fig'));
    if (!figs.length) return;
    parallaxListo = true;

    // guardar la profundidad una sola vez, así no la parseamos en cada frame
    const capas = figs.map(f => ({
      el: f,
      prof: parseFloat(f.dataset.prof) || 0.15,
      x: 0    // posición actual, que va persiguiendo a "y" con suavizado
    }));

    let objetivo = cuantoBajo();
    let corriendo = false;

    // rAF continuo mientras la posición "actual" no haya alcanzado al scroll.
    // Con lerp de 0.16: cada frame se acerca un 16% al objetivo. El movimiento
    // queda tipo mantequilla en vez de saltar en escalones.
    function tick(){
      let vivo = false;
      for (let i = 0; i < capas.length; i++){
        const c = capas[i];
        const meta = -objetivo * c.prof;
        const dif = meta - c.x;
        if (Math.abs(dif) > 0.08){
          c.x += dif * 0.16;
          vivo = true;
        } else {
          c.x = meta;
        }
        // translate3d fuerza aceleración por GPU (no se puede animar 'top')
        c.el.style.transform = 'translate3d(0,' + c.x.toFixed(2) + 'px,0)';
      }
      if (vivo) requestAnimationFrame(tick);
      else corriendo = false;
    }

    function arrancar(){
      objetivo = cuantoBajo();
      if (!corriendo){
        corriendo = true;
        requestAnimationFrame(tick);
      }
    }

    // scroll pasivo: iOS lo dispara con hueco al frenar, pero rAF sigue
    // suavizando entre eventos hasta que la posición cuadra
    window.addEventListener('scroll', arrancar, { passive: true });
    window.addEventListener('resize', arrancar);

    // primera pasada, sin animación (para que salgan ya en su sitio)
    capas.forEach(c => {
      c.x = -objetivo * c.prof;
      c.el.style.transform = 'translate3d(0,' + c.x + 'px,0)';
    });
  }

  /* ============================================================
     3. CIELO ESTRELLADO
     ============================================================ */
  const canvas = $('#cielo');
  const ctx = canvas.getContext('2d', { alpha: false });
  let estrellas = [], fugaz = null, ancho = 0, alto = 0, altoLienzo = 0, animando = true;

  function dimensionar(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    ancho = vw();
    alto  = vh();              // el alto de verdad, para comparar

    // el lienzo se hace más alto a propósito: cuando Safari esconde su barra
    // la pantalla crece, y así no aparece una franja vacía abajo
    altoLienzo = alto + 160;

    canvas.width  = Math.floor(ancho * dpr);
    canvas.height = Math.floor(altoLienzo * dpr);
    canvas.style.width  = ancho + 'px';
    canvas.style.height = altoLienzo + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    crearEstrellas();
  }

  function crearEstrellas(){
    const cantidad = Math.round(Math.min(180, (ancho * altoLienzo) / 5600));
    estrellas = [];
    for (let i = 0; i < cantidad; i++){
      estrellas.push({
        x: Math.random() * ancho,
        y: Math.random() * altoLienzo,
        r: Math.random() * 1.25 + 0.25,
        base: Math.random() * 0.5 + 0.25,
        vel: Math.random() * 0.014 + 0.004,
        fase: Math.random() * Math.PI * 2,
        rosa: Math.random() > 0.72
      });
    }
  }

  function lanzarFugaz(){
    if (menosMovimiento) return;
    fugaz = {
      x: Math.random() * ancho * 0.75,
      y: Math.random() * alto * 0.4,
      largo: 90 + Math.random() * 80,
      vel: 7 + Math.random() * 4,
      vida: 1
    };
  }

  let t = 0;
  function dibujar(){
    if (!animando) return;
    t += 0.016;

    // OJO: en iPhone, al deslizar, Safari esconde y saca la barra de direcciones
    // y eso cambia la altura de la ventana. Si redibujáramos por cada cambio,
    // el cielo daría un tirón en cada scroll. Solo se rehace si gira el
    // teléfono (cambia el ancho) o si el alto cambia muchísimo.
    if (Math.abs(vw() - ancho) > 2 || Math.abs(vh() - alto) > 140) dimensionar();

    const g = ctx.createLinearGradient(0, 0, 0, altoLienzo);
    g.addColorStop(0, '#221033');
    g.addColorStop(0.55, '#150a1c');
    g.addColorStop(1, '#0d0512');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, ancho, altoLienzo);

    for (let i = 0; i < estrellas.length; i++){
      const e = estrellas[i];
      const brillo = e.base + Math.sin(t * e.vel * 60 + e.fase) * 0.32;
      const a = Math.max(0.06, Math.min(1, brillo));
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, 6.2832);
      ctx.fillStyle = e.rosa
        ? 'rgba(252, 180, 210,' + a + ')'
        : 'rgba(255, 255, 255,' + a + ')';
      ctx.fill();
    }

    if (fugaz){
      ctx.save();
      const grad = ctx.createLinearGradient(
        fugaz.x, fugaz.y, fugaz.x - fugaz.largo, fugaz.y + fugaz.largo * 0.5
      );
      grad.addColorStop(0, 'rgba(255,225,240,' + (0.9 * fugaz.vida) + ')');
      grad.addColorStop(1, 'rgba(255,225,240,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(fugaz.x, fugaz.y);
      ctx.lineTo(fugaz.x - fugaz.largo, fugaz.y + fugaz.largo * 0.5);
      ctx.stroke();
      ctx.restore();

      fugaz.x += fugaz.vel;
      fugaz.y -= fugaz.vel * 0.5;
      fugaz.vida -= 0.012;
      if (fugaz.vida <= 0 || fugaz.x > ancho + 200) fugaz = null;
    }

    requestAnimationFrame(dibujar);
  }

  dimensionar();
  dibujar();

  // el mismo filtro que arriba: la barra de Safari también dispara "resize"
  window.addEventListener('resize', () => {
    if (Math.abs(vw() - ancho) > 2 || Math.abs(vh() - alto) > 140) dimensionar();
  });
  window.addEventListener('orientationchange', () => setTimeout(dimensionar, 250));

  setInterval(() => { if (!fugaz && Math.random() > 0.45) lanzarFugaz(); }, 5200);
  setTimeout(lanzarFugaz, 2600);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden){ animando = false; }
    else if (!animando){ animando = true; dibujar(); }
  });

  /* ============================================================
     4. ABRIR EL SOBRE
     ============================================================ */
  const sobre  = $('#sobre');
  const escena = $('#escena');
  const hoja   = $('#hoja');
  let abierto = false;
  let pendientes = [];          // los tiempos de la apertura, por si cierra antes

  function agendar(fn, ms){
    pendientes.push(setTimeout(fn, ms));
  }

  function abrir(){
    if (abierto) return;
    abierto = true;

    pendientes.forEach(clearTimeout);
    pendientes = [];

    // por si estaba a medio guardarse, se borra el rastro del cierre
    hoja.classList.remove('guardando');
    sobre.classList.remove('cerrando');

    escena.classList.add('abriendo');
    sobre.classList.add('abierto');
    vibrar(12);

    // El toque de ella es el gesto que iOS exige para dejar sonar el audio.
    // Cada vez que abre la carta, la canción empieza desde el principio.
    rebobinarCancion();
    arrancarMusica();

    agendar(() => {
      escena.classList.add('fuera');
      $('#velo').classList.add('ver');
      $('#decor').classList.add('ver');
      lanzarFugaz();
    }, 1450);

    agendar(() => {
      hoja.classList.add('abierta');
      activarScroll();
      agendar(() => hoja.classList.add('ver'), 40);
      $('#controles').classList.add('ver');
      montarParallax();
    }, 1900);

    agendar(() => {
      escena.style.display = 'none';
      vigilarNumeros();
      $('#baja').classList.add('ver');
    }, 3100);

    // Red de seguridad: pase lo que pase, la hoja se ve.
    agendar(() => {
      hoja.classList.add('abierta', 'ver');
      activarScroll();
      $('#decor').classList.add('ver');
      if (parseFloat(getComputedStyle(hoja).opacity) < 0.95){
        hoja.style.transition = 'none';
        hoja.style.opacity = '1';
        hoja.style.transform = 'none';
      }
    }, 4500);
  }

  /* --- cerrar la carta y dejar el sobre listo para abrirlo otra vez --- */
  function cerrar(){
    if (!abierto) return;
    abierto = false;

    // cancelar lo que quedara a medias de la apertura
    pendientes.forEach(clearTimeout);
    pendientes = [];
    if (soltarNumeros) soltarNumeros();

    // la canción se calla y vuelve al principio
    pararMusica();
    rebobinarCancion();

    vibrar(10);
    apagarFuegos();
    window.scrollTo(0, 0);

    $('#velo').classList.remove('ver');
    $('#controles').classList.remove('ver');
    $('#baja').classList.remove('ver');
    $('#respuesta').classList.remove('ver');

    // --- Se cierra al revés de como se abrió, como si la guardara ---

    // 1) la hoja se encoge y baja, buscando el sobre
    hoja.style.transition = '';
    hoja.style.opacity = '';
    hoja.style.transform = '';
    hoja.classList.remove('ver');
    hoja.classList.add('guardando');

    // 2) vuelve la escena, con el sobre todavía abierto y la hoja asomando
    agendar(() => {
      escena.style.display = '';
      sobre.classList.add('abierto', 'cerrando');
      void escena.offsetHeight;              // que registre el estado inicial
      escena.classList.remove('fuera', 'abriendo');
      $('#decor').classList.remove('ver');
    }, 620);

    // 3) el sobre se cierra: la hoja entra, la solapa baja y vuelve el sello
    agendar(() => {
      sobre.classList.remove('abierto');
      vibrar(14);
    }, 1500);

    // 4) a limpiar, ya con el sobre cerrado
    agendar(() => {
      sobre.classList.remove('cerrando');
      hoja.classList.remove('abierta', 'guardando');
      document.documentElement.classList.remove('leyendo');
      window.scrollTo(0, 0);

      // los días vuelven a cero, para que se cuenten otra vez al reabrir
      numerosHechos = false;
      hitos.forEach((h, i) => {
        const el = document.getElementById('num-' + i);
        if (el) el.textContent = '0';
      });
      yaBajo = false;
    }, 2500);
  }

  sobre.addEventListener('click', abrir);
  sobre.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrir(); }
  });

  /* ============================================================
     5. LOS NÚMEROS
     ============================================================ */
  let numerosHechos = false;

  function animarNumeros(){
    if (numerosHechos) return;
    numerosHechos = true;

    hitos.forEach((h, i) => {
      const el = document.getElementById('num-' + i);
      if (!el) return;

      const fijar = () => { el.textContent = h.dias.toLocaleString('es-MX'); };
      if (menosMovimiento){ fijar(); return; }

      const dur = 1700, espera = i * 320, t0 = performance.now() + espera;
      (function paso(ahora){
        if (ahora < t0){ requestAnimationFrame(paso); return; }
        const p = Math.min(1, (ahora - t0) / dur);
        const suave = 1 - Math.pow(1 - p, 4);
        el.textContent = Math.round(h.dias * suave).toLocaleString('es-MX');
        if (p < 1) requestAnimationFrame(paso);
      })(performance.now());

      setTimeout(fijar, espera + dur + 150);
    });
  }

  let soltarNumeros = null;   // para poder dejar de vigilar si se cierra la carta

  function vigilarNumeros(){
    if (soltarNumeros) soltarNumeros();
    const zona = $('#hitos');

    function revisar(){
      const r = zona.getBoundingClientRect();
      if (r.top < vh() * 0.85 && r.bottom > 0){
        animarNumeros();
        soltar();
      }
    }

    function soltar(){
      window.removeEventListener('scroll', revisar);
      clearInterval(repaso);
      soltarNumeros = null;
    }

    window.addEventListener('scroll', revisar, { passive: true });
    const repaso = setInterval(revisar, 500);
    soltarNumeros = soltar;
    revisar();
  }

  let yaBajo = false;
  window.addEventListener('scroll', () => {
    if (!yaBajo && cuantoBajo() > 60){
      yaBajo = true;
      $('#baja').classList.remove('ver');
    }
  }, { passive: true });

  /* ============================================================
     6. BOTONES
     ============================================================ */
  /* --- bajar solo, sin depender del scroll suave del navegador --- */
  function bajarHasta(elemento, margen){
    if (!elemento) return;
    const destino = cuantoBajo() + elemento.getBoundingClientRect().bottom
                    - vh() + (margen || 24);
    const tope = Math.max(0, Math.min(destino, document.documentElement.scrollHeight - vh()));
    const desde = cuantoBajo();
    const salto = tope - desde;
    if (Math.abs(salto) < 4) return;

    if (menosMovimiento){ window.scrollTo(0, tope); return; }

    const dur = 420, t0 = performance.now();
    (function paso(ahora){
      const p = Math.min(1, (ahora - t0) / dur);
      const suave = 1 - Math.pow(1 - p, 3);
      window.scrollTo(0, desde + salto * suave);
      if (p < 1) requestAnimationFrame(paso);
    })(performance.now());

    // si el navegador congelara las animaciones, al menos llega
    setTimeout(() => { if (Math.abs(cuantoBajo() - tope) > 40) window.scrollTo(0, tope); }, dur + 200);
  }

  $('#btn-perdon').addEventListener('click', () => {
    const resp = $('#respuesta');
    resp.classList.add('ver');
    vibrar([12, 50, 12, 50, 20]);
    fuegosArtificiales();
    lluviaDeCorazones();

    // la carta baja sola, y rápido, para que se lea el mensaje mientras aparece
    agendar(() => bajarHasta(resp, 30), 180);
    agendar(() => bajarHasta(resp, 30), 900);
    agendar(() => bajarHasta($('.acciones'), 30), 1900);
  });

  $('#btn-cerrar').addEventListener('click', cerrar);

  /* --- fuegos artificiales --- */
  const lienzoFuegos = $('#fuegos');
  const ctxF = lienzoFuegos.getContext('2d');
  let chispas = [], quemando = false, cortarFuegos = null;

  function medirFuegos(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    lienzoFuegos.width  = Math.floor(vw() * dpr);
    lienzoFuegos.height = Math.floor(vh() * dpr);
    lienzoFuegos.style.width  = vw() + 'px';
    lienzoFuegos.style.height = vh() + 'px';
    ctxF.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function estallido(x, y, color){
    const cuantas = 34 + Math.floor(Math.random() * 18);
    for (let i = 0; i < cuantas; i++){
      const ang = (Math.PI * 2 * i) / cuantas + Math.random() * 0.25;
      const fuerza = 2.1 + Math.random() * 3.6;
      chispas.push({
        x: x, y: y,
        vx: Math.cos(ang) * fuerza,
        vy: Math.sin(ang) * fuerza,
        vida: 1,
        baja: 0.011 + Math.random() * 0.013,
        r: 1.5 + Math.random() * 2.3,
        color: color
      });
    }
  }

  function pintarFuegos(){
    if (!quemando) return;
    ctxF.clearRect(0, 0, vw(), vh());

    for (let i = chispas.length - 1; i >= 0; i--){
      const c = chispas[i];
      c.x += c.vx;
      c.y += c.vy;
      c.vy += 0.055;              // la gravedad las va bajando
      c.vx *= 0.985;
      c.vy *= 0.985;
      c.vida -= c.baja;

      if (c.vida <= 0){ chispas.splice(i, 1); continue; }

      ctxF.globalAlpha = Math.max(0, c.vida);
      ctxF.fillStyle = c.color;
      ctxF.beginPath();
      ctxF.arc(c.x, c.y, c.r * c.vida, 0, 6.2832);
      ctxF.fill();
    }
    ctxF.globalAlpha = 1;

    if (chispas.length) requestAnimationFrame(pintarFuegos);
    else apagarFuegos();
  }

  function apagarFuegos(){
    quemando = false;
    chispas = [];
    try { ctxF.clearRect(0, 0, vw(), vh()); } catch(e){}
    lienzoFuegos.classList.remove('ver');
    if (cortarFuegos){ clearTimeout(cortarFuegos); cortarFuegos = null; }
  }

  function fuegosArtificiales(){
    if (menosMovimiento) return;

    medirFuegos();
    lienzoFuegos.classList.add('ver');

    if (!quemando){
      quemando = true;
      requestAnimationFrame(pintarFuegos);
    }

    const colores = ['#f9a8c9', '#e2618f', '#ffd9a0', '#ffffff', '#d9b8f0', '#ff8fb1', '#ffc4dd'];

    // once explosiones, una detrás de otra, por toda la pantalla
    for (let k = 0; k < 11; k++){
      agendar(() => {
        if (!quemando) return;
        estallido(
          vw() * (0.1 + Math.random() * 0.8),
          vh() * (0.12 + Math.random() * 0.52),
          colores[Math.floor(Math.random() * colores.length)]
        );
        vibrar(8);
      }, k * 300);
    }

    // por si el navegador congelara las animaciones, se limpia solo
    if (cortarFuegos) clearTimeout(cortarFuegos);
    cortarFuegos = setTimeout(apagarFuegos, 14000);
  }

  window.addEventListener('resize', () => { if (quemando) medirFuegos(); });

  function lluviaDeCorazones(){
    if (menosMovimiento) return;
    const simbolos = ['♥','♡','✿','❥','✦'];
    const colores = ['rgba(242,167,195,.95)','rgba(210,68,124,.9)',
                     'rgba(255,255,255,.85)','rgba(248,198,217,.95)'];
    for (let i = 0; i < 26; i++){
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'corazon';
        c.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
        c.style.left = (Math.random() * 92 + 4) + 'vw';
        c.style.fontSize = (12 + Math.random() * 16) + 'px';
        c.style.color = colores[Math.floor(Math.random() * colores.length)];
        c.style.animationDuration = (4.2 + Math.random() * 2.6) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 7200);
      }, i * 120);
    }
  }

  function vibrar(patron){
    if (navigator.vibrate){ try { navigator.vibrate(patron); } catch(e){} }
  }

  /* ============================================================
     7. MÚSICA · la canción, en bucle
     Arranca en cuanto ella toca el sobre (iOS exige ese toque para
     dejar sonar audio) y se repite sola, sin parar.
     ============================================================ */
  const audio = $('#cancion');
  let sonando = false;

  function marcar(activo){
    sonando = activo;
    $('#btn-musica').classList.toggle('on', activo);
  }

  if (CARTA.cancion){
    // igual que con los stickers: da igual dónde esté guardado el MP3
    const nombreMp3 = CARTA.cancion.split('/').pop();
    const rutasMp3 = [CARTA.cancion];
    if (CARTA.cancion.indexOf('/') > -1) rutasMp3.push(nombreMp3);
    else rutasMp3.push('img/' + nombreMp3);

    let intentoMp3 = 0;
    audio.addEventListener('error', () => {
      intentoMp3++;
      if (intentoMp3 < rutasMp3.length){
        audio.src = encodeURI(rutasMp3[intentoMp3]);
        audio.load();
        if (sonando) audio.play().catch(() => {});
      }
    });

    audio.src = encodeURI(rutasMp3[0]);
    audio.loop = true;
  } else {
    $('#controles').style.display = 'none';   // sin canción, el botón sobra
  }

  function arrancarMusica(){
    if (!CARTA.cancion) return;

    // entra bajito y va subiendo. En iPhone el volumen no se puede
    // cambiar por código: allí simplemente entra a su volumen normal.
    try { audio.volume = 0.15; } catch(e){}

    const intento = audio.play();
    if (intento && intento.then){
      intento.then(() => { marcar(true); subirVolumen(); })
             .catch(() => marcar(false));   // si el navegador lo bloquea, queda el botón ♪
    } else {
      marcar(true);
      subirVolumen();
    }
  }

  function subirVolumen(){
    let v = 0.15;
    const paso = setInterval(() => {
      v += 0.09;
      try { audio.volume = Math.min(1, v); } catch(e){}
      if (v >= 1) clearInterval(paso);
    }, 130);
    // pase lo que pase, en 2 segundos está a volumen completo
    setTimeout(() => { clearInterval(paso); try { audio.volume = 1; } catch(e){} }, 2000);
  }

  function pararMusica(){
    try { audio.pause(); } catch(e){}
    marcar(false);
  }

  // deja la canción lista para volver a empezar desde el principio
  function rebobinarCancion(){
    try { audio.currentTime = 0; } catch(e){}
  }

  // por si el bucle fallara en algún navegador
  audio.addEventListener('ended', () => {
    if (!sonando) return;
    audio.currentTime = 0;
    audio.play().catch(() => {});
  });

  audio.addEventListener('pause', () => marcar(false));
  audio.addEventListener('play',  () => marcar(true));

  $('#btn-musica').addEventListener('click', function(){
    sonando ? pararMusica() : arrancarMusica();
  });

  // al volver a la carta desde otra app, la canción sigue donde iba
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && sonando && audio.paused){
      audio.play().catch(() => {});
    }
  });

  // evitar el zoom por doble toque en iOS
  let ultimoToque = 0;
  document.addEventListener('touchend', e => {
    const ahora = Date.now();
    if (ahora - ultimoToque < 320) e.preventDefault();
    ultimoToque = ahora;
  }, { passive: false });

})();
</script>
</body>
</html>
